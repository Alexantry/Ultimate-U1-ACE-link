name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Installer transaction checks
        run: python -B -m unittest discover -s tests -p test_installer.py -v
      - name: Host integration checks
        run: python -B -m unittest discover -s tests/host -p 'test_*.py' -q
      - name: ACE USB tool checks
        run: python -B -m unittest discover -s tools/ace_usb -p 'test_*.py' -q
      - name: Build the public archive
        run: python -B tools/build_release.py
  windows-wizard:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell 5.1 guided installer checks
        shell: powershell
        run: .\tests\test_windows_wizard.ps1
      - name: Windows PowerShell 5.1 firmware preparation checks
        shell: powershell
        run: .\tests\test_bootstrap.ps1
      - name: Windows PowerShell 5.1 ACE firmware wizard checks
        shell: powershell
        run: .\tests\test_ace_firmware_wizard.ps1

