</g>
<g stroke="#8195b2" stroke-width="5" fill="none"><path d="M405 225H715"/><path d="M405 279H715"/><path d="M405 333H715"/><path d="M405 387H715"/></g>
<rect x="469" y="293" width="180" height="26" rx="8" fill="#f7f9fc"/><text x="492" y="312" font-size="17">Four PTFE paths</text>
<path d="M222 448V480H897V448" fill="none" stroke="#2563eb" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="374" y="462" width="371" height="35" rx="8" fill="#f7f9fc"/><text x="392" y="485" font-size="18" fill="#1d4ed8">USB: commands + filament data</text>
<rect x="40" y="524" width="1040" height="100" rx="14" fill="#e8eefb"/>
<text x="63" y="556" font-size="19" font-weight="700">ACE tag → ACE firmware → this integration → U1 material display</text>
<text x="63" y="584" font-size="17">External mode prevents the internal U1 reader from replacing external filament data.</text>
<text x="63" y="608" font-size="17">U1 OpenRFID keys do not transfer to ACE through this integration.</text>
<text x="40" y="654" font-size="16" fill="#526176">Concept diagram. Use the upstream hardware guide for assembly and tube routing. No NFC keys are included.</text>
</g></svg>

