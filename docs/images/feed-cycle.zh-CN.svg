<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="770" viewBox="0 0 1120 770" role="img" aria-labelledby="title desc">
<title id="title">耗材进退料与回送距离</title><desc id="desc">Insertion gives a short grip and NFC scan. A U1 load command starts fast feed and sensor seek. Unload retracts 1250 then feeds forward 300. The next fast feed uses 850. Unknown positions use only sensor seek.</desc>
<rect width="1120" height="770" rx="20" fill="#f7f9fc"/>
<g font-family="Microsoft YaHei, Arial, sans-serif" fill="#132238">
<text x="40" y="50" font-size="27" font-weight="700">耗材动作流程</text>
<text x="40" y="80" font-size="18" fill="#526176">实测参考参数 · 不是所有料管的通用值；距离和速度为控制指令值。</text>
<g font-size="19">
<rect x="40" y="110" width="1040" height="84" rx="13" fill="#ffffff" stroke="#bdcbdc"/>
<circle cx="80" cy="152" r="22" fill="#2563eb"/><text x="74" y="159" fill="white" font-weight="700">1</text>
<text x="122" y="145" font-weight="700">向空 ACE 槽插入耗材</text>
<text x="122" y="174" fill="#526176">短咬料并尝试识别 NFC；等用户在 U1 点进料后，才长送到头端。</text>
<rect x="40" y="210" width="1040" height="100" rx="13" fill="#ffffff" stroke="#bdcbdc"/>
<circle cx="80" cy="260" r="22" fill="#2563eb"/><text x="74" y="267" fill="white" font-weight="700">2</text>
<text x="122" y="244" font-weight="700">在 U1 选择进料</text>
<text x="122" y="276">起点确认后：1150 mm / 200 → 以 50 寻找头端 → 传感器到料后停止输送。</text>
<text x="122" y="299" font-size="16" fill="#526176">重启后起点不确定时，只用较慢的头端寻料流程。</text>
<rect x="40" y="326" width="1040" height="100" rx="13" fill="#ffffff" stroke="#bdcbdc"/>
<circle cx="80" cy="376" r="22" fill="#2563eb"/><text x="74" y="383" fill="white" font-weight="700">3</text>
<text x="122" y="360" font-weight="700">在 U1 选择退料</text>
<text x="122" y="391">U1 先退热端 → ACE 回抽 1250 / 80 → 已启用时向前回送 300 / 50。</text>
<text x="122" y="414" font-size="16" fill="#526176">回送把松圈拉入料管；不是独立驱动滚筒。新装默认关闭。</text>
<rect x="40" y="442" width="1040" height="100" rx="13" fill="#ffffff" stroke="#bdcbdc"/>
<circle cx="80" cy="492" r="22" fill="#2563eb"/><text x="74" y="499" fill="white" font-weight="700">4</text>
<text x="122" y="476" font-weight="700">耗材保持在 ACE 内，再点进料</text>
<text x="122" y="507">850 mm / 200 → 以 50 寻找头端 → 传感器到料后停止输送。</text>
<text x="122" y="530" font-size="16" fill="#526176">材料信息一直保留，直到 ACE 确认入口无料。</text>
</g>
<rect x="40" y="565" width="1040" height="107" rx="14" fill="#e8eefb"/>
<text x="63" y="599" font-size="21" font-weight="700">下次快速段 = 基础快速段 − 已确认完成的回送距离</text>
<text x="63" y="634" font-size="26" fill="#1d4ed8" font-weight="700">1150 − 300 = 850</text>
<text x="360" y="632" font-size="18">动作未确认完成时，不建立新的起点记录。</text>
<text x="40" y="707" font-size="17" fill="#526176">请按自己的料管校准；确认向前余量后再启用回送。</text>
<text x="40" y="736" font-size="17" fill="#526176">没有张力检测，固定回送长度不能判断料盘是否已收紧。</text>
</g></svg>
